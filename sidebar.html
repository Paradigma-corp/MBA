<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel lateral</title>
  <style>
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 280px;
      background-color: #0f172a;
      color: #e2e8f0;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #cbd5e1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .nav {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav li {
      padding: 10px 12px;
      border-radius: 10px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .nav li:hover {
      background-color: #1e293b;
      color: #f8fafc;
      cursor: pointer;
    }

    .content {
      flex: 1;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      padding: 40px;
    }

    .hint {
      background-color: #c7d2fe;
      color: #1e1b4b;
      padding: 14px 16px;
      border-radius: 12px;
      max-width: 560px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h2>Panel de navegación</h2>
    <ul class="nav">
      <li>Inicio</li>
      <li>Modelado de ventas</li>
      <li>Modelo de conteo</li>
      <li>SMC Pro EMTA</li>
      <li>Reportes consolidados</li>
      <li>Centro de alertas</li>
    </ul>
  </aside>
  <main class="content">
    <div class="hint">
      El elemento "SMC Pro EMTA" se ha ubicado justo debajo de "Modelo de conteo" en el panel lateral, tal como se solicitó.
    </div>
  </main>
</body>
</html>
